[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toklang"
version = "2.0.0"
description = "Deterministic, BPE-verified, negation-safe, and Cache-Aware (CAPC) prompt compiler for LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Matheus Sousa (Taiwansz)" }]
dependencies = []

[project.optional-dependencies]
bpe = ["tiktoken>=0.7.0"]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

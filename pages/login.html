<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card-header">
      <div class="auth-logo">Tok<span>Lang</span></div>
      <div class="auth-title">Entrar na conta</div>
      <div class="auth-sub">Acesse seu dashboard BPE e chaves de API</div>
    </div>
    <div class="auth-body">
      <div class="demo-notice"><span>[DEMO]</span><span>Modo local ativo: qualquer e-mail válido autentica a sessão de demonstração.</span></div>
      <button class="oauth-btn" onclick="oauthLogin('google')" aria-label="Entrar com Google">
        Entrar com Google
      </button>
      <div class="auth-divider">ou com e-mail</div>
      <div class="form-group"><label class="form-label" for="login-email">E-mail</label><input class="form-input" id="login-email" type="email" placeholder="voce@empresa.com" autocomplete="email" onkeydown="if(event.key==='Enter')document.getElementById('login-password').focus()"></div>
      <div class="form-group" style="margin-bottom:10px">
        <label class="form-label" style="display:flex;justify-content:space-between">Senha <a onclick="navigate('forgot')" style="color:var(--accent);cursor:pointer;font-size:10px">Esqueci a senha</a></label>
        <input class="form-input" id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
        <div class="form-error" id="login-error" style="display:none"></div>
      </div>
      <button class="form-btn" onclick="doLogin()" id="login-btn">Entrar</button>
      <div style="margin-top:14px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted)">Não tem conta? <a onclick="navigate('signup')" style="color:var(--accent);cursor:pointer;font-weight:600">Criar conta</a></div>
    </div>
  </div>
</div>

<div class="auth-page" style="padding-top:88px">
  <div class="auth-card" style="max-width:490px">
    <div class="auth-card-header">
      <div class="auth-logo">Tok<span>Lang</span></div>
      <div class="auth-title">Criar sua conta</div>
      <div class="auth-sub">Open-core gratuito localmente &middot; sem cartão de crédito</div>
    </div>
    <div class="auth-body" id="signup-form-step">
      <div class="demo-notice"><span>[DEMO]</span><span>Ambiente local sem Supabase configurado grava a sessão localmente.</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group"><label class="form-label">Nome</label><input class="form-input" id="signup-name" type="text" placeholder="Seu nome"></div>
        <div class="form-group"><label class="form-label">Sobrenome</label><input class="form-input" id="signup-last" type="text" placeholder="Sobrenome"></div>
      </div>
      <div class="form-group"><label class="form-label">E-mail</label><input class="form-input" id="signup-email" type="email" placeholder="voce@empresa.com"></div>
      <div class="form-group"><label class="form-label">Senha</label><input class="form-input" id="signup-password" type="password" placeholder="Mínimo 8 caracteres" oninput="checkPasswordStrength(this.value)"><div class="pw-strength"><div class="pw-bar" id="pw-bar"></div></div><div class="form-hint" id="pw-hint">Crie uma senha forte</div></div>
      <div class="form-group"><label class="form-label">Plano inicial</label>
        <div class="plan-picker">
          <div class="plan-option selected" onclick="selectPlan(this,'starter')"><div class="plan-option-name">Starter</div><div class="plan-option-price">R$ 10</div></div>
          <div class="plan-option" onclick="selectPlan(this,'pro')"><div class="plan-option-name">Pro</div><div class="plan-option-price">R$ 35</div></div>
          <div class="plan-option" onclick="selectPlan(this,'team')"><div class="plan-option-name">Team</div><div class="plan-option-price">R$ 80</div></div>
        </div>
      </div>
      <label class="check-group"><input type="checkbox" id="signup-terms"><div class="check-box">OK</div><div class="check-label">Aceito os <a>Termos de Uso</a> e a <a>Política de Privacidade</a></div></label>
      <div class="form-error" id="signup-error" style="display:none;margin-bottom:10px"></div>
      <button class="form-btn" onclick="doSignup()" id="signup-btn">Criar conta</button>
      <div style="margin-top:14px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted)">Já tem conta? <a onclick="navigate('login')" style="color:var(--accent);cursor:pointer;font-weight:600">Entrar</a></div>
    </div>

    <div class="auth-body" id="signup-success-step" style="display:none;text-align:center">
      <h3 style="font-size:20px;font-weight:800;margin-bottom:10px">Verifique seu E-mail</h3>
      <p style="color:var(--muted);font-size:13.5px;line-height:1.6;margin-bottom:20px">Enviamos um link de confirmação para <strong id="success-email-text"></strong>.</p>
      <button class="form-btn" onclick="navigate('login')">Ir para o Login</button>
    </div>
  </div>
</div>

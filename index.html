<script>
const ASSET_V = '20261126d';
function toggleMobileNav() {
  const drawer = document.getElementById('mobile-nav-drawer');
  const overlay = document.getElementById('mobile-nav-overlay');
  if (drawer && overlay) {
    const isOpen = drawer.classList.toggle('open');
    overlay.style.display = isOpen ? 'block' : 'none';
  }
}

function toggleTheme() {
  const isLight = document.documentElement.classList.toggle('light-theme');
  localStorage.setItem('theme', isLight ? 'light' : 'dark');
  updateThemeIcons();
  if (window.TokLangMotion && typeof window.TokLangMotion.syncHeaderTheme === 'function') {
    window.TokLangMotion.syncHeaderTheme();
  }
}

function updateThemeIcons() {
  const isLight = document.documentElement.classList.contains('light-theme');
  const darkIcon = document.getElementById('theme-icon-dark');
  const lightIcon = document.getElementById('theme-icon-light');
  if (darkIcon && lightIcon) {
    lightIcon.style.display = isLight ? 'none' : 'block';
    darkIcon.style.display = isLight ? 'block' : 'none';
  }
}

document.addEventListener('DOMContentLoaded', updateThemeIcons);

let pagesLoaded = false;
async function loadPages() {
  const configPromise = typeof syncProductionConfig === 'function' ? syncProductionConfig() : Promise.resolve();
  const pages = ['home', 'app', 'docs', 'pricing', 'login', 'signup', 'forgot', 'dashboard'];

  await Promise.all([
    configPromise,
    ...pages.map(async (p) => {
      try {
        const container = document.getElementById('page-' + p);
        if (container && container.innerHTML.trim() === '') {
          const res = await fetch('pages/' + p + '.html?v=' + ASSET_V);
          if (res.ok) container.innerHTML = await res.text();
        }
      } catch (e) {
        console.warn('Could not load page: ' + p, e);
      }
    })
  ]);

  pagesLoaded = true;
  initRouter();
  initReveal();
  if (typeof updateUsageUI === 'function') updateUsageUI();
  window.addEventListener('hashchange', () => {
    const hash = window.location.hash.replace('#', '');
    if (VALID_PAGES.includes(hash)) navigate(hash);
  });
}
loadPages();
</script>

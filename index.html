<script>
function toggleTheme() {
  const isLight = document.documentElement.classList.toggle('light-theme');
  localStorage.setItem('theme', isLight ? 'light' : 'dark');
  updateThemeIcons();
}

function updateThemeIcons() {
  const isLight = document.documentElement.classList.contains('light-theme');
  const darkIcon = document.getElementById('theme-icon-dark');
  const lightIcon = document.getElementById('theme-icon-light');
  if (darkIcon && lightIcon) {
    darkIcon.style.display = isLight ? 'none' : 'block';
    lightIcon.style.display = isLight ? 'block' : 'none';
  }
}

// Sync theme when another browser tab changes it
window.addEventListener('storage', function(e) {
  if (e.key === 'theme') {
    if (e.newValue === 'light') {
      document.documentElement.classList.add('light-theme');
    } else {
      document.documentElement.classList.remove('light-theme');
    }
    updateThemeIcons();
  }
});

// Sync icons when the page becomes visible again (e.g. switching browser tabs)
document.addEventListener('visibilitychange', function() {
  if (!document.hidden) {
    const savedTheme = localStorage.getItem('theme');
    const hasLight = document.documentElement.classList.contains('light-theme');
    if (savedTheme === 'light' && !hasLight) {
      document.documentElement.classList.add('light-theme');
    } else if (savedTheme !== 'light' && hasLight) {
      document.documentElement.classList.remove('light-theme');
    }
    updateThemeIcons();
  }
});

document.addEventListener('DOMContentLoaded', updateThemeIcons);
</script>
<script>
let pagesLoaded = false;
async function loadPages() {
  const pages = ['home','app','docs','pricing','login','signup','forgot','dashboard'];
  await Promise.all(pages.map(async p => {
    try {
      const res = await fetch('pages/' + p + '.html');
      if (res.ok) {
        document.getElementById('page-' + p).innerHTML = await res.text();
      }
    } catch(e) { console.warn('Could not load page: ' + p, e); }
  }));
  pagesLoaded = true;
  // Init after all pages loaded
  initRouter();
  initReveal();
  if (typeof updateUsageUI === 'function') updateUsageUI();
  window.addEventListener('hashchange', () => {
    const hash = window.location.hash.replace('#','');
    if (VALID_PAGES.includes(hash)) navigate(hash);
  });
}
loadPages();
</script>

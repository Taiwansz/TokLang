<div id="noise-bg"></div>

<!-- ===== NAV ===== -->
<nav id="nav">
  <div class="nav-logo" onclick="navigate('home')">Tok<span>Lang</span></div>
  <ul class="nav-links">
    <li><a onclick="navigate('home')" data-page="home">Início</a></li>
    <li><a onclick="navigate('app')" data-page="app">App</a></li>
    <li><a onclick="navigate('docs')" data-page="docs">Docs</a></li>
    <li><a onclick="navigate('pricing')" data-page="pricing">Preços</a></li>
  </ul>
  <div class="nav-auth-logged-out" id="nav-logged-out">
    <button class="nav-link-login" onclick="navigate('login')">Entrar</button>
    <button class="nav-cta" onclick="navigate('signup')">Criar conta</button>
  </div>
  <div class="nav-auth-logged-in" id="nav-logged-in" style="display:none">
    <button class="btn btn-ghost" onclick="navigate('dashboard')" style="padding:7px 16px;font-size:11px">Dashboard</button>
    <div class="nav-user-avatar" id="nav-avatar" onclick="navigate('dashboard')" title="Minha conta">TW</div>
  </div>
  <button class="nav-mobile-btn" onclick="navigate('app')">≡</button>

<!-- ============================================================ -->
<!-- PAGES: loaded via includes below                              -->
<!-- ============================================================ -->

<!-- PAGE: HOME (inline — loaded from pages/home.html concept) -->

<!-- PAGE: APP -->
<div id="page-app" class="page"></div>

<!-- PAGE: DOCS -->

<!-- PAGE: PRICING -->

<!-- PAGE: FORGOT -->

<!-- PAGE: DASHBOARD -->
<div id="page-dashboard" class="page"></div>

<!-- TOAST -->
<div class="toast" id="global-toast">
  <span class="toast-icon" id="toast-icon">✓</span>
  <span class="toast-msg" id="toast-msg">Ação realizada</span>
</div>

<!-- External SDKs -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<!-- JS Architecture -->
<script src="js/auth.js"></script>
<script src="js/billing.js"></script>
<script src="js/router.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/compressor.js"></script>

<!-- Page loader: fetches HTML partials into placeholders -->
<script>
async function loadPages() {
  const pages = ['home','app','docs','pricing','login','signup','forgot','dashboard'];
  await Promise.all(pages.map(async p => {
    try {
      const res = await fetch('pages/' + p + '.html');
      if (res.ok) {
        document.getElementById('page-' + p).innerHTML = await res.text();
      }
    } catch(e) { console.warn('Could not load page: ' + p, e); }
  }));
  // Init after all pages loaded
  initRouter();
  initReveal();
  updateUsageUI();
  window.addEventListener('hashchange', () => {
    const hash = window.location.hash.replace('#','');
    if (VALID_PAGES.includes(hash)) navigate(hash);
  });
}
loadPages();
</script>
</body>

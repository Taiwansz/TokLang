<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      margin: 0;
      background: #0c0f16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .logo {
      font-weight: 800;
      font-size: 16px;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    .logo span {
      color: #00ff88;
    }
    .title {
      font-size: 11px;
      text-transform: uppercase;
      font-family: monospace;
      color: #94a3b8;
      margin-bottom: 6px;
      letter-spacing: 0.05em;
    }
    .input-group {
      margin-bottom: 12px;
    }
    .input-key {
      width: 100%;
      box-sizing: border-box;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 4px;
      color: #fff;
      padding: 8px 10px;
      font-size: 12px;
      font-family: monospace;
      outline: none;
    }
    .input-key:focus {
      border-color: #00ff88;
    }
    .btn {
      width: 100%;
      background: #00ff88;
      color: #0c0f16;
      border: none;
      border-radius: 4px;
      padding: 8px 12px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #00dd77;
    }
    .status {
      font-size: 11px;
      color: #00ff88;
      text-align: center;
      margin-top: 10px;
      font-family: monospace;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">Tok<span>Lang</span></div>
    <span style="font-size: 9px; background: rgba(0,255,136,0.12); color: #00ff88; padding: 2px 6px; border-radius: 99px; font-family: monospace;">Extension</span>
  </div>
  <div class="input-group">
    <div class="title">Chave de API TokLang</div>
    <input type="password" id="api-key-input" class="input-key" placeholder="tl_live_••••••••••••••••">
  </div>
  <button class="btn" id="save-btn">Salvar Chave</button>
  <div class="status" id="status-msg"></div>
  <script src="popup.js"></script>
</body>
</html>
